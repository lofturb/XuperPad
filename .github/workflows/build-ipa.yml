name: Construir IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos
  APP_DIR: app
  APP_NAME: XuperPad

jobs:
  build-ipa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git jq file \
            libxml2 libbsd0 zlib1g libuuid1 xz-utils libz3-dev libtinfo6 python3-pil pkg-config
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Preparar libtinfo5
        run: |
          set -euo pipefail
          if ! sudo apt-get install -y libtinfo5; then
            echo "libtinfo5 no disponible; se enlaza libtinfo.so.6"
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          test -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Resolver release del SDK
        id: sdk
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL --retry 3 https://api.github.com/repos/theos/sdks/releases/latest | jq -r '.tag_name')
          test -n "$TAG"
          test "$TAG" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Instalar Theos
        run: |
          set -euo pipefail
          if [ ! -d "$THEOS/.git" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi

      - name: Cachear toolchain y SDK
        uses: actions/cache@v4
        with:
          path: |
            theos/toolchain/linux/iphone
            theos/sdks/iPhoneOS9.3.sdk
            theos/sdks/iPhoneOS10.3.sdk
          key: theos-${{ runner.os }}-armv7-${{ steps.sdk.outputs.tag }}-sbingner-v10

      - name: Instalar toolchain armv7
        run: |
          set -euo pipefail
          TOOLCHAIN_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"
          WORK="$RUNNER_TEMP/toolchain"
          rm -rf "$WORK"
          mkdir -p "$WORK" "$THEOS/toolchain/linux/iphone"
          curl -fL --retry 3 -o "$WORK/toolchain.tar.lzma" "$TOOLCHAIN_URL"
          xz --format=lzma -dc "$WORK/toolchain.tar.lzma" | tar -xf - -C "$WORK"
          test -d "$WORK/ios-arm64e-clang-toolchain"
          cp -R "$WORK/ios-arm64e-clang-toolchain/." "$THEOS/toolchain/linux/iphone/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          grep -qa armv7 "$THEOS/toolchain/linux/iphone/lib/libclang-cpp.so.10"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/probe.c"
          "$THEOS/toolchain/linux/iphone/bin/clang" -target armv7-apple-ios9.0 \
            -c "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe.o"
          test -s "$RUNNER_TEMP/probe.o"
          for BIN in clang ld ar as strip lipo ldid; do
            if ldd "$THEOS/toolchain/linux/iphone/bin/$BIN" | grep -q "not found"; then
              echo "Faltan librerias para $BIN:" >&2
              ldd "$THEOS/toolchain/linux/iphone/bin/$BIN" >&2
              exit 1
            fi
          done
          echo "Toolchain armv7 instalado"

      - name: Instalar SDKs de iOS
        env:
          SDK_TAG: ${{ steps.sdk.outputs.tag }}
        run: |
          set -euo pipefail
          SDK9="$THEOS/sdks/iPhoneOS9.3.sdk"
          SDK10="$THEOS/sdks/iPhoneOS10.3.sdk"
          mkdir -p "$THEOS/sdks"
          SDK_REPO="$THEOS/sdks_repo"
          if git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_REPO"; then
            git -C "$SDK_REPO" sparse-checkout set iPhoneOS9.3.sdk iPhoneOS10.3.sdk
            for NAME in iPhoneOS9.3 iPhoneOS10.3; do
              test -d "$SDK_REPO/$NAME.sdk"
              rm -rf "$THEOS/sdks/$NAME.sdk"
              cp -R "$SDK_REPO/$NAME.sdk" "$THEOS/sdks/$NAME.sdk"
            done
            echo "SDKs tomados del repositorio theos/sdks"
          else
            echo "AVISO: no se pudo clonar theos/sdks, se usan las tarballs del release"
            for NAME in iPhoneOS9.3 iPhoneOS10.3; do
              URL="https://github.com/theos/sdks/releases/download/$SDK_TAG/$NAME.sdk.tar.xz"
              curl -fL --retry 3 -o "$RUNNER_TEMP/$NAME.sdk.tar.xz" "$URL"
              rm -rf "$THEOS/sdks/$NAME.sdk"
              tar -xJf "$RUNNER_TEMP/$NAME.sdk.tar.xz" -C "$THEOS/sdks"
              test -d "$THEOS/sdks/$NAME.sdk"
            done
          fi
          if [ ! -f "$SDK9/usr/lib/system/liblaunch.tbd" ]; then
            if [ -f "$SDK10/usr/lib/system/liblaunch.tbd" ]; then
              cp "$SDK10/usr/lib/system/liblaunch.tbd" "$SDK9/usr/lib/system/liblaunch.tbd"
            elif [ -f "$SDK10/usr/lib/liblaunch.tbd" ]; then
              cp "$SDK10/usr/lib/liblaunch.tbd" "$SDK9/usr/lib/system/liblaunch.tbd"
            else
              echo "No se encontro liblaunch.tbd en el SDK 10.3" >&2
              exit 1
            fi
          fi
          for OBJ in crt1.o crt1.3.1.o dylib1.o bundle1.o gcrt1.o lazydylib1.o; do
            if [ ! -f "$SDK10/usr/lib/$OBJ" ] && [ -f "$SDK9/usr/lib/$OBJ" ]; then
              cp "$SDK9/usr/lib/$OBJ" "$SDK10/usr/lib/$OBJ"
              echo "Completado $OBJ en el SDK 10.3"
            fi
          done
          test -f "$SDK9/usr/lib/crt1.o"
          test -f "$SDK9/usr/lib/libSystem.tbd"
          test -f "$SDK10/usr/lib/crt1.o"
          test -f "$SDK10/usr/lib/libSystem.tbd"
          if ! grep -q -- "_strcmp" "$SDK10/usr/lib/system/libsystem_c.tbd"; then
            echo "El SDK 10.3 viene recortado, se actualizan los tbd de la libc"
            for NAME in libsystem_c libsystem_malloc libsystem_pthread libsystem_kernel \
              libsystem_info libsystem_m libsystem_platform libsystem_trace libsystem_blocks \
              libsystem_asl libsystem_dnssd libsystem_configuration libsystem_notify \
              libsystem_sandbox libsystem_coretls libsystem_coreservices \
              libsystem_containermanager libsystem_network libsystem_networkextension \
              libsystem_symptoms; do
              curl -fsSL --retry 3 \
                "https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS10.3.sdk/usr/lib/system/$NAME.tbd" \
                -o "$SDK10/usr/lib/system/$NAME.tbd" || true
            done
          fi
          grep -q -- "_strcmp" "$SDK10/usr/lib/system/libsystem_c.tbd" || {
            echo "El SDK 10.3 no expone la libc completa" >&2
            exit 1
          }
          for SDK in "$SDK9" "$SDK10"; do
            test -d "$SDK/System/Library/Frameworks/AVFoundation.framework"
            test -d "$SDK/System/Library/Frameworks/AVKit.framework"
            test -d "$SDK/System/Library/Frameworks/UIKit.framework"
          done
          echo "SDKs 9.3 y 10.3 instalados con AVFoundation, AVKit y UIKit"

      - name: Preparar la libc de armv7
        run: |
          set -euo pipefail
          SDK9="$THEOS/sdks/iPhoneOS9.3.sdk"
          SDK10="$THEOS/sdks/iPhoneOS10.3.sdk"
          python3 tools/generator_libsystem_tbd.py --sdk "$SDK9" --extra-sdk "$SDK10" \
            --output "$SDK9/usr/lib/libxuperlibc.tbd"
          python3 tools/generator_libsystem_tbd.py --sdk "$SDK10" --extra-sdk "$SDK9" \
            --output "$SDK10/usr/lib/libxuperlibc.tbd"
          for SDK in "$SDK9" "$SDK10"; do
            test -f "$SDK/usr/lib/libxuperlibc.tbd"
            grep -q "_strcmp" "$SDK/usr/lib/libxuperlibc.tbd"
            grep -q "_strncmp" "$SDK/usr/lib/libxuperlibc.tbd"
          done
          echo "La libc de armv7 queda disponible como libxuperlibc.tbd"

      - name: Instalar ldid
        run: |
          set -euo pipefail
          sudo ln -sf "$THEOS/toolchain/linux/iphone/bin/ldid" /usr/local/bin/ldid
          ldid 2>&1 | sed -n '1p' || true
          if ldd "$THEOS/toolchain/linux/iphone/bin/ldid" | grep -q "not found"; then
            echo "ldid no encuentra sus librerias" >&2
            ldd "$THEOS/toolchain/linux/iphone/bin/ldid" >&2
            exit 1
          fi

      - name: Revisar codigo fuente
        run: python3 tools/lint.py

      - name: Listar el toolchain
        run: ls "$THEOS/toolchain/linux/iphone/bin"

      - name: Cachear FFmpeg para armv7
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/vendor/ffmpeg
          key: ffmpeg-ios-armv7-n4.4.4-mbedtls-2.28.10-v4

      - name: Compilar FFmpeg para armv7
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash tools/compilar_ffmpeg_ios.sh
          ls -l app/vendor/ffmpeg/lib
          du -sh app/vendor/ffmpeg

      - name: Generar recursos
        run: python3 tools/generar_recursos.py

      - name: Compilar y empaquetar
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          make clean || true
          rm -rf /tmp/org.llvm.clang.runner/ModuleCache
          make -k package FINALPACKAGE=1 PACKAGE_FORMAT=ipa

      - name: Verificar el IPA
        run: |
          set -euo pipefail
          shopt -s nullglob
          IPAS=("$APP_DIR"/packages/*.ipa)
          if [ ${#IPAS[@]} -ne 1 ]; then
            echo "Se esperaba exactamente un IPA, se encontraron ${#IPAS[@]}" >&2
            exit 1
          fi
          IPA="${IPAS[0]}"
          echo "IPA=$IPA"
          unzip -l "$IPA"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/Payload/$APP_NAME.app/$APP_NAME"
          test -f "$RUNNER_TEMP/ipa/Payload/$APP_NAME.app/Info.plist"
          python3 - "$RUNNER_TEMP/ipa/Payload/$APP_NAME.app/$APP_NAME" <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as handle:
              data = handle.read()
          magic = data[:4]
          if magic == b"\xce\xfa\xed\xfe":
              endian = "<"
          elif magic == b"\xfe\xed\xfa\xce":
              endian = ">"
          else:
              raise SystemExit(f"Mach-O no reconocido: {magic.hex()}")
          cputype, cpusubtype, filetype, ncmds, sizeofcmds, flags = struct.unpack(
              endian + "6I", data[4:28]
          )
          if cputype != 12:
              raise SystemExit(f"Se esperaba CPU_TYPE_ARM (12), se obtuvo {cputype}")
          subtype = cpusubtype & 0x00FFFFFF
          if subtype not in (9, 11):
              raise SystemExit(f"Se esperaba armv7/armv7s, se obtuvo {subtype}")
          if not flags & 0x200000:
              raise SystemExit("El binario no tiene MH_PIE, no se puede instalar en iOS")
          offset = 28
          min_os = None
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack(endian + "2I", data[offset:offset + 8])
              if cmd == 0x25:
                  version, sdk = struct.unpack(endian + "2I", data[offset + 8:offset + 16])
                  min_os = (version >> 16, (version >> 8) & 0xFF, version & 0xFF)
              offset += cmdsize
          if min_os is None:
              raise SystemExit("El binario no declara LC_VERSION_MIN_IPHONEOS")
          if min_os < (9, 0, 0):
              raise SystemExit(f"El binario declara iOS {min_os[0]}.{min_os[1]}.{min_os[2]}")
          print(
              f"Binario verificado: cputype={cputype} cpusubtype={subtype} "
              f"pie=1 minos={min_os[0]}.{min_os[1]}.{min_os[2]}"
          )
          PY

      - name: Publicar como Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ETIQUETA="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$ETIQUETA" "$APP_DIR"/packages/*.ipa \
            --title "Build $ETIQUETA" \
            --notes "Compilacion automatica de XuperPad para iPad mini 1 con iOS 9." \
            --latest
